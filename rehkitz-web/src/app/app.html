<main class="app-shell" [class.auth-shell]="isLoginRoute">
  <header class="app-header" *ngIf="!isLoginRoute">
    <h1>{{ title }}</h1>
    <nav class="header-nav" *ngIf="currentUser">
      <a routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a>
      <a routerLink="/map" routerLinkActive="active-link">Karte</a>
      <a routerLink="/applications" routerLinkActive="active-link">Anträge</a>
      <a routerLink="/users" routerLinkActive="active-link">Benutzerverwaltung</a>
    </nav>
    <div class="header-user" *ngIf="currentUser as user">
      <span>{{ user.email }} ({{ user.role }})</span>
      <button type="button" (click)="onLogout()">Logout</button>
    </div>
  </header>
  <section class="app-content">
    <router-outlet></router-outlet>
  </section>
</main>
